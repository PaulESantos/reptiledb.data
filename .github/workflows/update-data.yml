name: Automatic Data Update

on:
  schedule:
    # Run at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:

name: update-data

jobs:
  check-and-update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::readxl
            any::httr
            any::rvest
            any::dplyr
            any::purrr
            any::stringr
            any::tidyr
            any::usethis
            any::devtools
            any::cli

      - name: Check for remote updates and update dataset
        run: |
          Rscript data-raw/update_package_data.R

      - name: Create Pull Request for dataset update
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): update Reptile Database snapshot"
          title: "chore(data): update Reptile Database snapshot"
          body: |
            Automated dataset update from **The Reptile Database**.
            
            This PR was automatically generated by the `update-data` GitHub Action.
            
            - Downloaded latest checklist
            - Cleaned and standardized taxonomic columns
            - Updated dataset in `data/` and documentation
          branch: auto-update-reptiledb
          base: main
          delete-branch: true
